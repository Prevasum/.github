name: Actionlint

# Lints the calling repo's workflows. Call it from CI and make `ci-ok` need it:
#
#   actionlint:
#     needs: changes
#     if: needs.changes.outputs.code == 'true'
#     permissions:
#       contents: read
#     uses: Prevasum/.github/.github/workflows/actionlint.yml@main
#
# When bumping the version, also update `hooks/actionlint-pre-commit.sh` and
# `.githooks/pre-commit`.

on:
  workflow_call:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  # Of the linux_amd64 archive, from the release's checksums file.
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # Job-level, since in a reusable workflow `github.workflow` is the
    # caller's name.
    concurrency:
      group: actionlint-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint

      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
