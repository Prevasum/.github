name: PR Single Commit Validation

# The `pr-checks` org ruleset runs this on every repo's PRs. A ruleset can't
# count a PR's commits, so this check does.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  validate-single-commit:
    # No author squashes a bot's branch. A skipped job counts as passing.
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'openapi-sync--') }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Single Commit Validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count="$(gh api "repos/$REPO/pulls/$PR" -q .commits)"
          if [ "$count" -eq 1 ]; then
            echo "PR has one commit"
            exit 0
          fi
          echo "::error::The PR has $count commits and must have one. Squash them into one commit (git reset --soft \$(git merge-base HEAD origin/<default branch>) && git commit), or amend review changes into it with git commit --amend, then git push --force-with-lease. See 'One commit per PR' in CODING_STANDARDS.md in Prevasum/docs."
          exit 1
