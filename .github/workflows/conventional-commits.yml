name: PR Conventional Commit Validation

# The `pr-checks` org ruleset runs this on every repo's PRs into its
# default branch, so no repo needs its own copy.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses:  ytanikin/pr-conventional-commits@1.4.0
        with:
          task_types: '["build","chore","ci","docs","feat","fix","perf","refactor","style","test","revert"]'
          add_label: 'false'
