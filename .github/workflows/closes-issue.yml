name: PR Closes Issue Validation

# The `pr-checks` org ruleset runs this on every repo's PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  issues: read

jobs:
  validate-closes-issue:
    # Bot PRs close no issue. A skipped job counts as passing.
    if: ${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.head_ref, 'openapi-sync--') }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Closes Issue Validation
        env:
          # The default token can't see issues in other private repos.
          GH_TOKEN: ${{ secrets.CI_READ_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # Retry, since closingIssuesReferences can lag an edit by seconds.
        run: |
          for _ in 1 2 3; do
            closes="$(gh pr view "$PR" -R "$REPO" --json closingIssuesReferences \
              -q '[.closingIssuesReferences[] | "#\(.number)"] | join(" ")')"
            if [ -n "$closes" ]; then
              echo "PR closes $closes"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The PR body must end with 'Closes #<issue>' (or 'Closes <org>/<repo>#<issue>' for another repo), naming an issue that exists. See CODING_STANDARDS.md in Prevasum/docs."
          exit 1
