name: PR Closes Issue Validation

# The `pr-checks` org ruleset runs this on every repo's PRs into its
# default branch, so no repo needs its own copy.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  issues: read

jobs:
  validate-closes-issue:
    # Release-please PRs only bump the version and changelog, and close no
    # issue. A skipped job counts as passing, so they can still merge.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Closes Issue Validation
        env:
          GH_TOKEN: ${{ github.token }}
          # Reads issues in other private repos, which the default token can't,
          # but not pull requests, so it never looks up the PR itself.
          CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # GitHub lists the issues a PR closes only once the Closes line names an
        # issue that exists. It can lag a few seconds behind an edit, so retry.
        run: |
          for attempt in 1 2 3; do
            closes="$(gh pr view "$PR" -R "$REPO" --json closingIssuesReferences \
              -q '[.closingIssuesReferences[] | "#\(.number)"] | join(" ")')"
            if [ -n "$closes" ]; then
              echo "PR closes $closes"
              exit 0
            fi
            sleep 5
          done
          # The default token can't see an issue in another private repo, so the
          # PR lists it as closing nothing. Check each such reference directly.
          body="$(gh pr view "$PR" -R "$REPO" --json body -q .body)"
          refs="$(printf '%s\n' "$body" \
            | grep -oiE "(close[sd]?|fix(e[sd])?|resolve[sd]?):? +$OWNER/[A-Za-z0-9._-]+#[0-9]+" \
            | grep -oE '[A-Za-z0-9._-]+/[A-Za-z0-9._-]+#[0-9]+' || true)"
          for ref in $refs; do
            found="$(GH_TOKEN="$CI_READ_TOKEN" gh api "repos/${ref%#*}/issues/${ref#*#}" \
              --jq 'select(.pull_request | not) | .number' 2>/dev/null || true)"
            if [ -n "$found" ]; then
              echo "PR closes $ref"
              exit 0
            fi
          done
          echo "::error::The PR body must end with 'Closes #<issue>' (or 'Closes <org>/<repo>#<issue>' for another repo), naming an issue that exists. See CODING_STANDARDS.md in Prevasum/docs."
          exit 1
