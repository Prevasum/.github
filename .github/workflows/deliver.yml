name: Deliver

# A service repo calls this on every push to its main branch. This repo is
# public, so every identifier comes from the caller's GitHub environment for
# dev (the `environment` input), which sets these variables:
#
#   GCP_PROJECT                 the Environment's project
#   GCP_REGION                  where its Cloud Run services, jobs, worker
#                               pools, and instance groups run
#   GCP_WIF_PROVIDER            its Workload Identity provider
#   GCP_DEPLOY_SERVICE_ACCOUNT  the repo's deploy identity there
#   IMAGE_REPOSITORY            the service's repository in the image registry
#   DEPLOY_RESOURCES            a JSON object naming, for each target and the
#                               migrations job, its resource in the Environment
#   SMOKE_JOB                   the Environment's smoke Cloud Run job
#   SMOKE_DEVICE                with smoke-device, the repo's Smoke Device in
#                               the Environment, whose bootstrap PSK and
#                               device key are its Secret Manager secrets
#                               <SMOKE_DEVICE>-bootstrap-psk and
#                               <SMOKE_DEVICE>-device-key
#   CI_READER_WIF_PROVIDER      with smoke-device, the read-only CI identity's
#   CI_READER_SERVICE_ACCOUNT   Workload Identity provider and account, which
#                               fetch the Smoke Device's firmware
#
# With smoke-device, each deploy ends by running local-stack's smoke suite,
# `smoke/run.sh` from its main branch, with the deploy's Environment in
# SMOKE_ENVIRONMENT, the Device's ID in SMOKE_DEVICE_ID, files holding its
# keys in SMOKE_BOOTSTRAP_PSK_FILE and SMOKE_DEVICE_KEY_FILE, the
# Environment's smoke client secret in SMOKE_CLIENT_SECRET, and the read-only
# CI identity, in place of the deploy identity, as its Google credentials.
# The suite exits non-zero when any check fails, and the deploy then rolls
# back. A Smoke Device that isn't in service yet fails every run, so a caller
# turns smoke-device on once its Smoke Device passes a run.
#
# An instance-group target is a regional managed instance group that
# autoheals on the health check its load balancer uses. Its instance
# template's metadata `image` names the image its instances run, and each
# instance, once its container starts, writes that container's image by
# digest to its guest attribute `container/image`.
#
# The caller grants `contents: read` and `id-token: write`, since a called
# workflow can't hold more than its caller.

on:
  workflow_call:
    inputs:
      service:
        description: The image's name, and its repository's in the registry.
        required: true
        type: string
      targets:
        description: >-
          A JSON list of deploy targets, each {"name": ..., "kind": ...}, all
          deployed from the one image. Kinds: cloud-run, cloud-run-job,
          worker-pool, instance-group. A target with "prod-only": true runs
          outside every Environment, so this only builds its image.
        required: true
        type: string
      migrations:
        description: >-
          A target name for a Cloud Run job that runs once to completion, on
          the new image, before any target deploys.
        required: false
        type: string
        default: ""
      context:
        description: The Docker build context.
        required: false
        type: string
        default: .
      file:
        description: The Dockerfile, when it isn't the context's Dockerfile.
        required: false
        type: string
        default: ""
      environment:
        description: The caller's GitHub environment for dev.
        required: false
        type: string
        default: development
      image-repository:
        description: >-
          The service's repository in the image registry, when it isn't the
          environment's IMAGE_REPOSITORY.
        required: false
        type: string
        default: ""
      tag-prod:
        description: >-
          Also move :prod once dev passes, so readers have a prod image to
          resolve before the service has a prod Environment to promote to.
        required: false
        type: boolean
        default: true
      smoke-device:
        description: >-
          End each deploy by running the repo's Smoke Device, which the
          environment's SMOKE_DEVICE names, through the smoke suite.
        required: false
        type: boolean
        default: false
    secrets:
      smoke-client-secret:
        description: With smoke-device, the dev smoke client's secret.
        required: false
      local-stack-token:
        description: With smoke-device, a token that can read Prevasum/local-stack.
        required: false
      oncall-webhook:
        description: >-
          The incoming webhook of the Server on-call Chat space, which a run
          that fails or rolls back posts to.
        required: false
    outputs:
      image:
        description: The image built, by digest.
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IMAGE_REPOSITORY: ${{ inputs.image-repository || vars.IMAGE_REPOSITORY }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      dev-targets: ${{ steps.targets.outputs.dev-targets }}
    steps:
      # Checked before building, so a misconfigured caller fails in seconds.
      - name: Check the targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          MIGRATIONS: ${{ inputs.migrations }}
          DEPLOY_RESOURCES: ${{ vars.DEPLOY_RESOURCES }}
          SMOKE_DEVICE_ON: ${{ inputs.smoke-device }}
          SMOKE_DEVICE: ${{ vars.SMOKE_DEVICE }}
          CI_READER_WIF_PROVIDER: ${{ vars.CI_READER_WIF_PROVIDER }}
          CI_READER_SERVICE_ACCOUNT: ${{ vars.CI_READER_SERVICE_ACCOUNT }}
          HAS_SMOKE_CLIENT_SECRET: ${{ secrets.smoke-client-secret != '' }}
          HAS_LOCAL_STACK_TOKEN: ${{ secrets.local-stack-token != '' }}
        run: |
          set -euo pipefail
          if [ "$SMOKE_DEVICE_ON" = true ]; then
            for setting in SMOKE_DEVICE CI_READER_WIF_PROVIDER CI_READER_SERVICE_ACCOUNT; do
              [ -n "${!setting}" ] \
                || { echo "::error::smoke-device needs $setting in the environment"; exit 1; }
            done
            [ "$HAS_SMOKE_CLIENT_SECRET" = true ] \
              || { echo "::error::smoke-device needs the smoke-client-secret secret"; exit 1; }
            [ "$HAS_LOCAL_STACK_TOKEN" = true ] \
              || { echo "::error::smoke-device needs the local-stack-token secret"; exit 1; }
          fi
          jq -e 'type == "array" and length > 0' <<<"$TARGETS" >/dev/null \
            || { echo "::error::targets must be a non-empty JSON list"; exit 1; }
          jq -e 'type == "object"' <<<"${DEPLOY_RESOURCES:-null}" >/dev/null \
            || { echo "::error::DEPLOY_RESOURCES must be a JSON object in the environment"; exit 1; }
          failed=0
          while IFS=$'\t' read -r name kind; do
            case "$kind" in
              cloud-run | cloud-run-job | worker-pool | instance-group) ;;
              *) echo "::error::target $name has unknown kind '$kind'"; failed=1 ;;
            esac
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")
          jq -e 'all(.[]; .["prod-only"] | . == null or type == "boolean")' <<<"$TARGETS" >/dev/null \
            || { echo "::error::a target's prod-only must be true or false"; failed=1; }
          dev_targets="$(jq -c 'map(select(.["prod-only"] != true))' <<<"$TARGETS")"
          for name in $(jq -r '.[].name' <<<"$dev_targets") $MIGRATIONS; do
            jq -e --arg n "$name" '.[$n] | type == "string"' <<<"$DEPLOY_RESOURCES" >/dev/null \
              || { echo "::error::DEPLOY_RESOURCES names no resource for $name"; failed=1; }
          done
          echo "dev-targets=$dev_targets" >>"$GITHUB_OUTPUT"
          exit "$failed"

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sign Docker in to the registry
        run: gcloud auth configure-docker "${IMAGE_REPOSITORY%%/*}" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE_REPOSITORY }}/${{ inputs.service }}:sha-${{ github.sha }}
          # Without an attestation the push is a single image manifest, so
          # the digest recorded here is the one every deploy target reports.
          provenance: false
          cache-from: type=gha,scope=deliver-${{ inputs.service }}
          cache-to: type=gha,scope=deliver-${{ inputs.service }},mode=max

      - name: Record the digest
        id: image
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}/${{ inputs.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "image=$IMAGE@$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $IMAGE@$DIGEST" >>"$GITHUB_STEP_SUMMARY"

  dev:
    needs: build
    if: needs.build.outputs.dev-targets != '[]'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # A Smoke Device can play only one run at a time, and one repo can
    # deploy several services, so with one every deploy from the repo to the
    # Environment takes its turn in the Smoke Device's group. The deploy and
    # the Smoke Device's run stay one job, so a newer deploy never lands
    # between this deploy and its check, or under its rollback.
    concurrency:
      group: ${{ inputs.smoke-device && 'smoke-device-dev' || format('deliver-{0}', inputs.service) }}
      cancel-in-progress: false
    outputs:
      rollback: ${{ steps.rollback.outputs.rollback }}
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      TARGETS: ${{ needs.build.outputs.dev-targets }}
      DEPLOY_RESOURCES: ${{ vars.DEPLOY_RESOURCES }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
      CLOUDSDK_COMPUTE_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Migrations only expand the schema, so the revisions still serving keep
      # working on it, and a rollback leaves it in place.
      - name: Run the migrations
        if: inputs.migrations != ''
        env:
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          set -euo pipefail
          job="$(jq -r --arg n "$MIGRATIONS" '.[$n]' <<<"$DEPLOY_RESOURCES")"
          gcloud run jobs update "$job" --image "$IMAGE" --quiet
          gcloud run jobs execute "$job" --wait

      - name: Deploy candidates
        run: |
          set -euo pipefail
          # The rollback step restores what rollback.tsv records, written as
          # each target changes.
          : >"$RUNNER_TEMP/rollback.tsv"
          : >"$RUNNER_TEMP/candidates.tsv"
          while IFS=$'\t' read -r name kind; do
            resource="$(jq -r --arg n "$name" '.[$n]' <<<"$DEPLOY_RESOURCES")"
            case "$kind" in
              cloud-run)
                gcloud run deploy "$resource" --image "$IMAGE" \
                  --no-traffic --tag candidate --quiet
                gcloud run services describe "$resource" --format=json >"$RUNNER_TEMP/service.json"
                revision="$(jq -r '.status.traffic[] | select(.tag == "candidate") | .revisionName' "$RUNNER_TEMP/service.json")"
                url="$(jq -r '.status.traffic[] | select(.tag == "candidate") | .url' "$RUNNER_TEMP/service.json")"
                audience="$(jq -r '.status.url' "$RUNNER_TEMP/service.json")"
                printf '%s\t%s\t%s\t%s\n' "$resource" "$revision" "$url" "$audience" >>"$RUNNER_TEMP/candidates.tsv"
                ;;
            esac
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")

      # The smoke job reaches internal-ingress services and IAP-fronted ones
      # alike, which a GitHub runner can't. Its container sets no command, so
      # these arguments are its whole command line, and gcloud's ^@^ prefix
      # splits them on @, which the script must not contain.
      - name: Smoke-test the candidates
        env:
          SMOKE_JOB: ${{ vars.SMOKE_JOB }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/candidates.tsv" ]; then
            echo "No HTTP candidates to smoke-test."
            exit 0
          fi
          read -r -d '' script <<'SMOKE' || true
          set -euo pipefail
          sha="$1"
          shift
          identity=http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity
          while [ "$#" -gt 0 ]; do
            url="$1"
            audience="$2"
            shift 2
            token="$(curl -fsS -H 'Metadata-Flavor: Google' "$identity?audience=$audience")"
            curl -fsS --retry 3 -o /dev/null -H "Authorization: Bearer $token" "$url/health"
            version="$(curl -fsS --retry 3 -H "Authorization: Bearer $token" "$url/version")"
            case "$version" in
              *"sha-$sha"*) echo "$url is healthy at sha-$sha" ;;
              *) echo "$url/version returned $version, not sha-$sha"; exit 1 ;;
            esac
          done
          SMOKE
          args="^@^bash@-c@$script@smoke@$SHA"
          while IFS=$'\t' read -r _ _ url audience; do
            args="$args@$url@$audience"
          done <"$RUNNER_TEMP/candidates.tsv"
          gcloud run jobs execute "$SMOKE_JOB" --args="$args" --wait

      # A worker pool takes no requests, so it has no candidate to test before
      # it takes over: its new revision takes every instance at once, and a
      # failure deploys the digest it ran before. The previous digest is
      # recorded before the deploy, so a deploy that fails partway rolls back
      # too, and the deploy's bound leaves the rollback time to finish inside
      # the 5 minutes a failed deploy may last.
      - name: Update the worker pools
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name kind; do
            [ "$kind" = worker-pool ] || continue
            resource="$(jq -r --arg n "$name" '.[$n]' <<<"$DEPLOY_RESOURCES")"
            serving="$(gcloud run worker-pools describe "$resource" --format=json \
              | jq -r '[.status.instanceSplits[]? | select(.percent > 0)] | max_by(.percent) | .revisionName // empty')"
            previous=""
            if [ -n "$serving" ]; then
              previous="$(gcloud run worker-pools revisions describe "$serving" --format='value(status.imageDigest)')"
            fi
            if [ -z "$previous" ]; then
              echo "::error::Can't tell which digest $resource runs, so it couldn't be rolled back."
              exit 1
            fi
            printf 'worker-pool\t%s\t%s\n' "$resource" "$previous" >>"$RUNNER_TEMP/rollback.tsv"
            timeout 180 gcloud run worker-pools deploy "$resource" --image "$IMAGE" --quiet \
              || { echo "::error::$resource's new revision didn't become ready within 3 minutes."; exit 1; }

            gcloud run worker-pools describe "$resource" --format=json >"$RUNNER_TEMP/pool.json"
            revision="$(jq -r '.status.latestCreatedRevisionName // empty' "$RUNNER_TEMP/pool.json")"
            ready="$(jq -r '.status.latestReadyRevisionName // empty' "$RUNNER_TEMP/pool.json")"
            serving="$(jq -r '[.status.instanceSplits[]? | select(.percent > 0) | .revisionName] | join(",")' "$RUNNER_TEMP/pool.json")"
            if [ -z "$revision" ] || [ "$ready" != "$revision" ] || [ "$serving" != "$revision" ]; then
              echo "::error::$resource serves '$serving', not its new revision $revision."
              exit 1
            fi
            running="$(gcloud run worker-pools revisions describe "$revision" --format='value(status.imageDigest)')"
            if [ "${running##*@}" != "${IMAGE##*@}" ]; then
              echo "::error::$resource's revision $revision runs $running, not $IMAGE."
              exit 1
            fi
            echo "$resource runs $IMAGE on revision $revision"
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")

      # A new template copies the current one but for its image, and a
      # rolling update brings an instance up on it before the old one goes.
      # The old one can drain for up to an hour, so this waits only for the
      # new one to be healthy, which, since the group autoheals on its load
      # balancer's health check, is when the load balancer sends it new
      # flows. `wait-until --stable` would wait out the drain too. The bounds
      # leave the rollback time to finish inside the 5 minutes a failed
      # deploy may last.
      - name: Roll out the instance groups
        run: |
          set -euo pipefail
          # The rollback step runs this file too.
          cat >"$RUNNER_TEMP/instance-group.sh" <<'HELPERS'
          # Waits up to $3 seconds for an instance of group $1 on template $2
          # to be running and healthy, and prints its URL.
          healthy_instance() {
            local deadline=$((SECONDS + $3)) instance
            while :; do
              instance="$(gcloud compute instance-groups managed list-instances "$1" \
                --region "$CLOUDSDK_COMPUTE_REGION" --format=json \
                | jq -r --arg t "${2#*/projects/}" 'first(.[]
                    | select((.version.instanceTemplate | sub("^.*/projects/"; "")) == $t
                      and .instanceStatus == "RUNNING" and .currentAction == "NONE"
                      and (.instanceHealth // []) != []
                      and all(.instanceHealth[]; .detailedHealthState == "HEALTHY"))
                    | .instance) // empty')"
              if [ -n "$instance" ]; then
                echo "$instance"
                return 0
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                return 1
              fi
              sleep 10
            done
          }
          HELPERS
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/instance-group.sh"
          token="$(gcloud auth print-access-token)"
          auth=(-H "Authorization: Bearer $token" -H "Content-Type: application/json")
          digest="${IMAGE##*@}"
          while IFS=$'\t' read -r name kind; do
            [ "$kind" = instance-group ] || continue
            group="$(jq -r --arg n "$name" '.[$n]' <<<"$DEPLOY_RESOURCES")"
            current="$(gcloud compute instance-groups managed describe "$group" \
              --region "$CLOUDSDK_COMPUTE_REGION" --format=json \
              | jq -r 'if (.versions | length) == 1 then .versions[0].instanceTemplate else empty end')"
            if [ -z "$current" ]; then
              echo "::error::$group isn't on exactly one instance template."
              exit 1
            fi

            # A rerun of the same digest finds its template already made.
            hex="${digest#sha256:}"
            template_name="${group:0:50}"
            template_name="${template_name%-}-${hex:0:12}"
            template="${current%/*}/$template_name"
            status="$(curl -sS -o "$RUNNER_TEMP/template.json" -w '%{http_code}' "${auth[@]}" "$template")"
            if [ "$status" = 404 ]; then
              curl -fsS "${auth[@]}" "$current" >"$RUNNER_TEMP/current.json"
              jq -e '[.properties.metadata.items[]? | select(.key == "image")] | length == 1' \
                "$RUNNER_TEMP/current.json" >/dev/null \
                || { echo "::error::$current has no image metadata."; exit 1; }
              jq --arg name "$template_name" --arg image "$IMAGE" '
                {name: $name, properties: (.properties
                  | .metadata.items |= map(if .key == "image" then .value = $image else . end)
                  | del(.metadata.fingerprint))}' \
                "$RUNNER_TEMP/current.json" >"$RUNNER_TEMP/template.json"
              operation="$(curl -fsS "${auth[@]}" --data @"$RUNNER_TEMP/template.json" "${current%/*}" | jq -r .selfLink)"
              # Each wait call returns when the operation is done or after
              # about 2 minutes, whichever is first.
              while :; do
                curl -fsS "${auth[@]}" -X POST "$operation/wait" >"$RUNNER_TEMP/operation.json"
                jq -e '.status == "DONE"' "$RUNNER_TEMP/operation.json" >/dev/null && break
              done
              if jq -e '.error' "$RUNNER_TEMP/operation.json" >/dev/null; then
                echo "::error::Creating $template failed: $(jq -c .error "$RUNNER_TEMP/operation.json")"
                exit 1
              fi
            elif [ "$status" = 200 ]; then
              jq -e --arg image "$IMAGE" '[.properties.metadata.items[]? | select(.key == "image") | .value] == [$image]' \
                "$RUNNER_TEMP/template.json" >/dev/null \
                || { echo "::error::$template exists with another image."; exit 1; }
            else
              echo "::error::Reading $template returned HTTP $status."
              exit 1
            fi

            gcloud compute instance-groups managed rolling-action start-update "$group" \
              --region "$CLOUDSDK_COMPUTE_REGION" --version=template="$template" \
              --max-surge=1 --max-unavailable=0 --quiet
            printf 'instance-group\t%s\t%s\n' "$group" "$current" >>"$RUNNER_TEMP/rollback.tsv"
            instance="$(healthy_instance "$group" "$template" 240)" \
              || { echo "::error::No instance of $group on $template was healthy within 4 minutes."; exit 1; }

            zone="$(sed -E 's|.*/zones/([^/]+)/.*|\1|' <<<"$instance")"
            running=""
            for _ in 1 2 3 4 5 6; do
              if running="$(gcloud compute instances get-guest-attributes "${instance##*/}" --zone "$zone" \
                --query-path=container/image --format='value(value)' 2>/dev/null)" && [ -n "$running" ]; then
                break
              fi
              sleep 5
            done
            if [ "${running##*@}" != "$digest" ]; then
              echo "::error::${instance##*/} runs '$running', not $IMAGE."
              exit 1
            fi
            echo "$group runs $IMAGE on ${instance##*/}"
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")

      - name: Move traffic and jobs to the new image
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r resource revision _ _; do
            previous="$(gcloud run services describe "$resource" --format=json \
              | jq -r '[.status.traffic[] | select(.percent > 0) | "\(.revisionName)=\(.percent)"] | join(",")')"
            gcloud run services update-traffic "$resource" --to-revisions="$revision=100" --quiet
            printf 'cloud-run\t%s\t%s\n' "$resource" "$previous" >>"$RUNNER_TEMP/rollback.tsv"
          done <"$RUNNER_TEMP/candidates.tsv"
          while IFS=$'\t' read -r name kind; do
            resource="$(jq -r --arg n "$name" '.[$n]' <<<"$DEPLOY_RESOURCES")"
            case "$kind" in
              cloud-run-job)
                previous="$(gcloud run jobs describe "$resource" --format=json \
                  | jq -r '.spec.template.spec.template.spec.containers[0].image')"
                gcloud run jobs update "$resource" --image "$IMAGE" --quiet
                printf 'cloud-run-job\t%s\t%s\n' "$resource" "$previous" >>"$RUNNER_TEMP/rollback.tsv"
                ;;
            esac
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")

      # The Smoke Device checks in through the Server as it now serves, so it
      # runs once every target has the new image.
      - name: Read the Smoke Device's keys
        if: inputs.smoke-device
        env:
          SMOKE_DEVICE: ${{ vars.SMOKE_DEVICE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/smoke-device"
          for key in bootstrap-psk device-key; do
            if ! gcloud secrets versions access latest --secret "$SMOKE_DEVICE-$key" \
              --out-file "$RUNNER_TEMP/smoke-device/$key"; then
              rm -rf "$RUNNER_TEMP/smoke-device"
              echo "::error::Can't read $SMOKE_DEVICE's $key, so the Smoke Device can't run. Is it Provisioned, with its keys stored?"
              exit 1
            fi
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] || echo "::add-mask::$line"
            done <"$RUNNER_TEMP/smoke-device/$key"
          done

      - name: Authenticate the smoke suite
        id: ci-reader
        if: inputs.smoke-device
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.CI_READER_WIF_PROVIDER }}
          service_account: ${{ vars.CI_READER_SERVICE_ACCOUNT }}
          # The later steps keep the deploy identity.
          export_environment_variables: false

      - name: Check out the smoke suite
        if: inputs.smoke-device
        uses: actions/checkout@v4
        with:
          repository: Prevasum/local-stack
          ref: main
          token: ${{ secrets.local-stack-token }}
          path: local-stack
          persist-credentials: false

      - name: Run the Smoke Device
        if: inputs.smoke-device
        env:
          SMOKE_DEVICE: ${{ vars.SMOKE_DEVICE }}
          SMOKE_CLIENT_SECRET: ${{ secrets.smoke-client-secret }}
          CI_READER_CREDENTIALS: ${{ steps.ci-reader.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          # The bound keeps a hung run from holding the Smoke Device's group;
          # the suite's own waits are far shorter.
          status=0
          env -u GOOGLE_GHA_CREDS_PATH -u CLOUDSDK_CORE_PROJECT -u CLOUDSDK_PROJECT \
            -u GCLOUD_PROJECT -u GCP_PROJECT -u GOOGLE_CLOUD_PROJECT \
            -u CLOUDSDK_RUN_REGION -u CLOUDSDK_COMPUTE_REGION \
            GOOGLE_APPLICATION_CREDENTIALS="$CI_READER_CREDENTIALS" \
            CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$CI_READER_CREDENTIALS" \
            SMOKE_ENVIRONMENT=dev \
            SMOKE_DEVICE_ID="$SMOKE_DEVICE" \
            SMOKE_BOOTSTRAP_PSK_FILE="$RUNNER_TEMP/smoke-device/bootstrap-psk" \
            SMOKE_DEVICE_KEY_FILE="$RUNNER_TEMP/smoke-device/device-key" \
            timeout 600 bash local-stack/smoke/run.sh || status=$?
          rm -rf "$RUNNER_TEMP/smoke-device"
          case "$status" in
            0) echo "$SMOKE_DEVICE passed the smoke suite" ;;
            124) echo "::error::The smoke suite didn't finish within 10 minutes."; exit 1 ;;
            *) echo "::error::$SMOKE_DEVICE failed the smoke suite."; exit 1 ;;
          esac

      # Only digests that passed smoke get an Environment tag, since every
      # reader of a tag trusts it.
      - name: Move the Environment tags
        env:
          TAG_PROD: ${{ inputs.tag-prod }}
        run: |
          set -euo pipefail
          repository="${IMAGE%@*}"
          tags=(dev)
          if [ "$TAG_PROD" = true ]; then
            tags+=(prod)
          fi
          for tag in "${tags[@]}"; do
            # A tag's first move has nothing to go back to.
            if previous="$(gcloud artifacts docker images describe "$repository:$tag" \
              --format='value(image_summary.digest)' 2>/dev/null)"; then
              printf 'tag\t%s\t%s\n' "$repository:$tag" "$repository@$previous" >>"$RUNNER_TEMP/rollback.tsv"
            fi
            gcloud artifacts docker tags add "$IMAGE" "$repository:$tag" --quiet
          done

      # A candidate that failed smoke never took traffic, so this undoes only
      # what the steps after smoke changed.
      - name: Roll back
        id: rollback
        if: failure()
        run: |
          set -uo pipefail
          if [ ! -s "$RUNNER_TEMP/rollback.tsv" ]; then
            echo "rollback=none" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          failed=0
          while IFS=$'\t' read -r kind resource previous; do
            case "$kind" in
              cloud-run) gcloud run services update-traffic "$resource" --to-revisions="$previous" --quiet || failed=1 ;;
              cloud-run-job) gcloud run jobs update "$resource" --image "$previous" --quiet || failed=1 ;;
              worker-pool) gcloud run worker-pools deploy "$resource" --image "$previous" --quiet || failed=1 ;;
              instance-group)
                # shellcheck source=/dev/null
                . "$RUNNER_TEMP/instance-group.sh"
                if gcloud compute instance-groups managed rolling-action start-update "$resource" \
                  --region "$CLOUDSDK_COMPUTE_REGION" --version=template="$previous" \
                  --max-surge=1 --max-unavailable=0 --quiet; then
                  healthy_instance "$resource" "$previous" 240 >/dev/null || failed=1
                else
                  failed=1
                fi
                ;;
              tag) gcloud artifacts docker tags add "$previous" "$resource" --quiet || failed=1 ;;
            esac
          done <"$RUNNER_TEMP/rollback.tsv"
          if [ "$failed" -ne 0 ]; then
            echo "rollback=failed" >>"$GITHUB_OUTPUT"
            echo "::error::The rollback failed; restore the previous revisions, job and worker pool images, instance templates, and tags by hand."
          else
            echo "rollback=done" >>"$GITHUB_OUTPUT"
          fi
          exit "$failed"

  # A run can't fail or roll back without a needed job failing. A cancelled
  # run, replaced by a newer pending one, is neither.
  notify:
    needs: [build, dev]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Server on-call
        env:
          WEBHOOK: ${{ secrets.oncall-webhook }}
          SERVICE: ${{ inputs.service }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          BUILD: ${{ needs.build.result }}
          ROLLBACK: ${{ needs.dev.outputs.rollback }}
        run: |
          set -euo pipefail
          if [ "$BUILD" = failure ]; then
            what="didn't build, so nothing was deployed"
          else
            case "$ROLLBACK" in
              done) what="failed in dev and was rolled back" ;;
              failed) what="failed in dev, and its rollback failed too: restore dev by hand" ;;
              *) what="failed in dev with nothing to roll back" ;;
            esac
          fi
          text="Deploy of $SERVICE from $REPOSITORY at ${SHA:0:7} $what. $RUN_URL"
          echo "$text"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::No oncall-webhook secret, so nothing was posted to Server on-call."
            exit 0
          fi
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS --retry 3 -o /dev/null -H 'Content-Type: application/json; charset=UTF-8' \
              --data @- "$WEBHOOK"
