name: Deliver

# Builds a service's image once and deploys it to dev. A service repo calls
# this on each push to main, granting `contents: read` and `id-token: write`.
#
# This repo is public, so identifiers come from the caller's GitHub
# environment (the `environment` input):
#
#   GCP_PROJECT                 the Environment's project
#   GCP_REGION                  the region its resources run in
#   GCP_WIF_PROVIDER            Workload Identity provider
#   GCP_DEPLOY_SERVICE_ACCOUNT  the repo's deploy identity
#   IMAGE_REPOSITORY            the service's image registry repository
#   DEPLOY_RESOURCES            JSON object mapping each target, and the
#                               migrations job, to its resource name
#   DEPLOY_ENV                  optional, see below
#   SMOKE_JOB                   the smoke Cloud Run job
#
# and with smoke-device:
#
#   SMOKE_DEVICE                the repo's Smoke Device, whose Secret Manager
#                               secrets are <SMOKE_DEVICE>-bootstrap-psk,
#                               <SMOKE_DEVICE>-device-key, <SMOKE_DEVICE>-psk
#   SMOKE_GATEWAY_URI           the Gateway it connects to
#   CI_READER_WIF_PROVIDER      the read-only CI identity, which fetches the
#   CI_READER_SERVICE_ACCOUNT   Smoke Device's firmware
#
# DEPLOY_ENV maps a cloud-run target to
# {"vars": {NAME: value}, "secrets": {NAME: "secret:version"}}. The entry
# replaces all the literal variables and secrets, mounted ones included. A
# target with no entry keeps the serving revision's.
#
# An instance-group target is a regional managed instance group that autoheals
# on its load balancer's health check. Its instance template's `image` metadata
# names the image, and each instance writes the digest it runs to its guest
# attribute `container/image`. An instance-group-node target is the same, for
# a service whose instances each hold a node ID that only one may have at a
# time: its groups, one per node, deploy one at a time, each replacing its
# instance in place at surge 0, even when there is only one. An
# instance-group target that lists several groups in DEPLOY_RESOURCES deploys
# the same way.
#
# smoke-device runs `smoke/run.sh` from local-stack's main branch, which
# documents its inputs. SMOKE_PSK_FILE and SMOKE_GATEWAY_URI are interim, until
# the smoke build bootstraps. Turn smoke-device on only after the Smoke Device
# passes a run, or every deploy rolls back.
#
# build-only needs only GCP_PROJECT, GCP_WIF_PROVIDER,
# GCP_DEPLOY_SERVICE_ACCOUNT, and IMAGE_REPOSITORY. The :prod it sets is NOT
# smoke-tested.

on:
  workflow_call:
    inputs:
      service:
        description: The image's name.
        required: true
        type: string
      targets:
        description: >-
          A JSON list of {"name": ..., "kind": ...}, all deployed from the one
          image. Kinds: cloud-run, cloud-run-job, worker-pool, instance-group,
          instance-group-node.
          A "prod-only": true target is built but not deployed. May be [] with
          build-only.
        required: true
        type: string
      migrations:
        description: >-
          The target name of a Cloud Run job that runs on the new image before
          any target deploys.
        required: false
        type: string
        default: ""
      context:
        description: The Docker build context.
        required: false
        type: string
        default: .
      file:
        description: The Dockerfile, when it isn't the context's Dockerfile.
        required: false
        type: string
        default: ""
      target:
        description: The Dockerfile stage to build, when it isn't the last.
        required: false
        type: string
        default: ""
      environment:
        description: The caller's GitHub environment for dev.
        required: false
        type: string
        default: development
      image-repository:
        description: Overrides the environment's IMAGE_REPOSITORY.
        required: false
        type: string
        default: ""
      tag-prod:
        description: >-
          Also move :prod once dev passes, for a service with no prod
          Environment to promote to yet.
        required: false
        type: boolean
        default: true
      smoke-device:
        description: >-
          Run the environment's SMOKE_DEVICE through the smoke suite on each
          deploy.
        required: false
        type: boolean
        default: false
      build-only:
        description: >-
          Only build the image and move :prod to it: no deploy, migrations,
          smoke test, rollback, or :dev. Ignores tag-prod and smoke-device.
        required: false
        type: boolean
        default: false
      submodules:
        description: >-
          Submodules to check out: '' (none), 'true', or 'recursive'. Private
          ones need checkout-token.
        required: false
        type: string
        default: ""
    secrets:
      checkout-token:
        description: A token that can read the repo's private submodules.
        required: false
      smoke-client-secret:
        description: With smoke-device, the dev smoke client's secret.
        required: false
      local-stack-token:
        description: With smoke-device, a token that can read Prevasum/local-stack.
        required: false
      oncall-webhook:
        description: >-
          The Server on-call Chat webhook, posted to when a run fails.
        required: false
    outputs:
      image:
        description: The image built, by digest.
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IMAGE_REPOSITORY: ${{ inputs.image-repository || vars.IMAGE_REPOSITORY }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      dev-targets: ${{ steps.targets.outputs.dev-targets }}
    steps:
      - name: Check the targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          MIGRATIONS: ${{ inputs.migrations }}
          DEPLOY_RESOURCES: ${{ vars.DEPLOY_RESOURCES }}
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
          BUILD_ONLY: ${{ inputs.build-only }}
          SMOKE_DEVICE_ON: ${{ inputs.smoke-device }}
          SMOKE_DEVICE: ${{ vars.SMOKE_DEVICE }}
          SMOKE_GATEWAY_URI: ${{ vars.SMOKE_GATEWAY_URI }}
          CI_READER_WIF_PROVIDER: ${{ vars.CI_READER_WIF_PROVIDER }}
          CI_READER_SERVICE_ACCOUNT: ${{ vars.CI_READER_SERVICE_ACCOUNT }}
          HAS_SMOKE_CLIENT_SECRET: ${{ secrets.smoke-client-secret != '' }}
          HAS_LOCAL_STACK_TOKEN: ${{ secrets.local-stack-token != '' }}
        run: |
          set -euo pipefail
          if [ "$BUILD_ONLY" = true ]; then
            jq -e 'type == "array"' <<<"$TARGETS" >/dev/null \
              || { echo "::error::targets must be a JSON list"; exit 1; }
            echo "dev-targets=[]" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SMOKE_DEVICE_ON" = true ]; then
            for setting in SMOKE_DEVICE SMOKE_GATEWAY_URI CI_READER_WIF_PROVIDER CI_READER_SERVICE_ACCOUNT; do
              [ -n "${!setting}" ] \
                || { echo "::error::smoke-device needs $setting in the environment"; exit 1; }
            done
            [ "$HAS_SMOKE_CLIENT_SECRET" = true ] \
              || { echo "::error::smoke-device needs the smoke-client-secret secret"; exit 1; }
            [ "$HAS_LOCAL_STACK_TOKEN" = true ] \
              || { echo "::error::smoke-device needs the local-stack-token secret"; exit 1; }
          fi
          jq -e 'type == "array" and length > 0' <<<"$TARGETS" >/dev/null \
            || { echo "::error::targets must be a non-empty JSON list"; exit 1; }
          failed=0
          while IFS=$'\t' read -r name kind; do
            case "$kind" in
              cloud-run | cloud-run-job | worker-pool | instance-group | instance-group-node) ;;
              *) echo "::error::target $name has unknown kind '$kind'"; failed=1 ;;
            esac
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")
          jq -e 'all(.[]; .["prod-only"] | . == null or type == "boolean")' <<<"$TARGETS" >/dev/null \
            || { echo "::error::a target's prod-only must be true or false"; failed=1; }
          dev_targets="$(jq -c 'map(select(.["prod-only"] != true))' <<<"$TARGETS")"
          if [ "$dev_targets" = "[]" ] && [ -z "$MIGRATIONS" ]; then
            echo "dev-targets=[]" >>"$GITHUB_OUTPUT"
            exit "$failed"
          fi
          jq -e 'type == "object"' <<<"${DEPLOY_RESOURCES:-null}" >/dev/null \
            || { echo "::error::DEPLOY_RESOURCES must be a JSON object in the environment"; exit 1; }
          for name in $(jq -r '.[].name' <<<"$dev_targets") $MIGRATIONS; do
            jq -e --arg n "$name" '.[$n] | type == "string"' <<<"$DEPLOY_RESOURCES" >/dev/null \
              && continue
            if jq -e --arg n "$name" 'map(select(.name == $n and (.kind == "instance-group" or .kind == "instance-group-node"))) | length > 0' \
                <<<"$dev_targets" >/dev/null \
              && jq -e --arg n "$name" '.[$n] | type == "array" and length > 0 and all(.[]; type == "string")' \
                <<<"$DEPLOY_RESOURCES" >/dev/null; then
              continue
            fi
            echo "::error::DEPLOY_RESOURCES names no resource for $name"
            failed=1
          done
          # Both keys are required, since a missing one would clear the
          # revision's. gcloud takes secrets as a NAME=SECRET:VERSION,... list,
          # hence no commas or equals signs.
          if [ -n "$DEPLOY_ENV" ]; then
            if jq -e 'type == "object" and all(.[];
                  type == "object" and has("vars") and has("secrets")
                  and (.vars | type == "object" and all(.[]; type == "string"))
                  and (.secrets | type == "object"
                    and all(to_entries[]; (.key | test("^[^,=]+$"))
                      and (.value | type == "string" and test("^[^,=:]+:[^,=:]+$")))))' \
                <<<"$DEPLOY_ENV" >/dev/null; then
              for name in $(jq -r 'keys[]' <<<"$DEPLOY_ENV"); do
                jq -e --arg n "$name" 'any(.[]; .name == $n and .kind == "cloud-run")' <<<"$dev_targets" >/dev/null \
                  || echo "::warning::DEPLOY_ENV has an entry for $name, which is no cloud-run target here, so no deploy uses it"
              done
            else
              echo '::error::DEPLOY_ENV must map each cloud-run target to {"vars": {NAME: value}, "secrets": {NAME: "secret:version"}}'
              failed=1
            fi
          fi
          echo "dev-targets=$dev_targets" >>"$GITHUB_OUTPUT"
          exit "$failed"

      - uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.checkout-token || github.token }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sign Docker in to the registry
        run: gcloud auth configure-docker "${IMAGE_REPOSITORY%%/*}" --quiet

      - uses: docker/setup-buildx-action@v3

      # Without SOURCE_DATE_EPOCH, BuildKit stamps the build time into the
      # image, so each run of a commit pushes a new digest. A Dockerfile's RUN
      # sees it only if declared, and layer file times stay as they are.
      - name: Read the commit time
        id: source-date-epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.source-date-epoch.outputs.epoch }}
          tags: ${{ env.IMAGE_REPOSITORY }}/${{ inputs.service }}:sha-${{ github.sha }}
          # An attestation would make the digest differ from the one deploy
          # targets report.
          provenance: false
          cache-from: type=gha,scope=deliver-${{ inputs.service }}
          cache-to: type=gha,scope=deliver-${{ inputs.service }},mode=max

      - name: Record the digest
        id: image
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}/${{ inputs.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "image=$IMAGE@$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $IMAGE@$DIGEST" >>"$GITHUB_STEP_SUMMARY"

  dev:
    needs: build
    if: inputs.build-only == false && needs.build.outputs.dev-targets != '[]'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # A Smoke Device plays one run at a time, so a repo's smoke deploys share
    # one group. Deploy and smoke run stay one job so that no newer deploy
    # lands between them.
    concurrency:
      group: ${{ inputs.smoke-device && 'smoke-device-dev' || format('deliver-{0}', inputs.service) }}
      cancel-in-progress: false
    outputs:
      rollback: ${{ steps.rollback.outputs.rollback }}
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      TARGETS: ${{ needs.build.outputs.dev-targets }}
      DEPLOY_RESOURCES: ${{ vars.DEPLOY_RESOURCES }}
      DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
      CLOUDSDK_COMPUTE_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Migrations only expand the schema, so serving revisions keep working
      # and a rollback leaves it in place.
      - name: Run the migrations
        if: inputs.migrations != ''
        env:
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          set -euo pipefail
          job="$(jq -r --arg n "$MIGRATIONS" '.[$n]' <<<"$DEPLOY_RESOURCES")"
          gcloud run jobs update "$job" --image "$IMAGE" --quiet
          gcloud run jobs execute "$job" --wait

      - name: Deploy candidates
        run: |
          set -euo pipefail
          : >"$RUNNER_TEMP/rollback.tsv"
          : >"$RUNNER_TEMP/candidates.tsv"
          while IFS=$'\t' read -r name kind; do
            resource="$(jq -r --arg n "$name" '.[$n]' <<<"$DEPLOY_RESOURCES")"
            case "$kind" in
              cloud-run)
                env_flags=()
                entry="$(jq -c --arg n "$name" '.[$n] // empty' <<<"${DEPLOY_ENV:-null}")"
                if [ -n "$entry" ]; then
                  if jq -e '.vars == {}' <<<"$entry" >/dev/null; then
                    env_flags+=(--clear-env-vars)
                  else
                    # A file, since a value may hold the commas that
                    # --set-env-vars splits on.
                    jq '.vars' <<<"$entry" >"$RUNNER_TEMP/env-vars.yaml"
                    env_flags+=(--env-vars-file "$RUNNER_TEMP/env-vars.yaml")
                  fi
                  secrets="$(jq -r '.secrets | to_entries | map("\(.key)=\(.value)") | join(",")' <<<"$entry")"
                  if [ -n "$secrets" ]; then
                    env_flags+=(--set-secrets "$secrets")
                  else
                    env_flags+=(--clear-secrets)
                  fi
                fi
                gcloud run deploy "$resource" --image "$IMAGE" "${env_flags[@]}" \
                  --no-traffic --tag candidate --quiet
                gcloud run services describe "$resource" --format=json >"$RUNNER_TEMP/service.json"
                revision="$(jq -r '.status.traffic[] | select(.tag == "candidate") | .revisionName' "$RUNNER_TEMP/service.json")"
                url="$(jq -r '.status.traffic[] | select(.tag == "candidate") | .url' "$RUNNER_TEMP/service.json")"
                audience="$(jq -r '.status.url' "$RUNNER_TEMP/service.json")"
                printf '%s\t%s\t%s\t%s\n' "$resource" "$revision" "$url" "$audience" >>"$RUNNER_TEMP/candidates.tsv"
                ;;
            esac
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")

      # A Cloud Run job reaches internal and IAP-fronted services, which a
      # runner can't. Its container sets no command, so --args is the whole
      # command line, split on @ (gcloud's ^@^), which the script must not
      # contain.
      - name: Smoke-test the candidates
        env:
          SMOKE_JOB: ${{ vars.SMOKE_JOB }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/candidates.tsv" ]; then
            echo "No HTTP candidates to smoke-test."
            exit 0
          fi
          read -r -d '' script <<'SMOKE' || true
          set -euo pipefail
          sha="$1"
          shift
          identity=http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity
          while [ "$#" -gt 0 ]; do
            url="$1"
            audience="$2"
            shift 2
            token="$(curl -fsS -H 'Metadata-Flavor: Google' "$identity?audience=$audience")"
            curl -fsS --retry 3 -o /dev/null -H "Authorization: Bearer $token" "$url/health"
            version="$(curl -fsS --retry 3 -H "Authorization: Bearer $token" "$url/version")"
            case "$version" in
              *"sha-$sha"*) echo "$url is healthy at sha-$sha" ;;
              *) echo "$url/version returned $version, not sha-$sha"; exit 1 ;;
            esac
          done
          SMOKE
          args="^@^bash@-c@$script@smoke@$SHA"
          while IFS=$'\t' read -r _ _ url audience; do
            args="$args@$url@$audience"
          done <"$RUNNER_TEMP/candidates.tsv"
          gcloud run jobs execute "$SMOKE_JOB" --args="$args" --wait

      # Worker pools take no requests, so there's no candidate to test: the new
      # revision takes every instance at once. The previous digest is recorded
      # first, so a partial deploy rolls back too. The timeout leaves time for
      # that.
      - name: Update the worker pools
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name kind; do
            [ "$kind" = worker-pool ] || continue
            resource="$(jq -r --arg n "$name" '.[$n]' <<<"$DEPLOY_RESOURCES")"
            serving="$(gcloud run worker-pools describe "$resource" --format=json \
              | jq -r '[.status.instanceSplits[]? | select(.percent > 0)] | max_by(.percent) | .revisionName // empty')"
            previous=""
            if [ -n "$serving" ]; then
              previous="$(gcloud run worker-pools revisions describe "$serving" --format='value(status.imageDigest)')"
            fi
            if [ -z "$previous" ]; then
              echo "::error::Can't tell which digest $resource runs, so it couldn't be rolled back."
              exit 1
            fi
            printf 'worker-pool\t%s\t%s\n' "$resource" "$previous" >>"$RUNNER_TEMP/rollback.tsv"
            timeout 180 gcloud run worker-pools deploy "$resource" --image "$IMAGE" --quiet \
              || { echo "::error::$resource's new revision didn't become ready within 3 minutes."; exit 1; }

            gcloud run worker-pools describe "$resource" --format=json >"$RUNNER_TEMP/pool.json"
            revision="$(jq -r '.status.latestCreatedRevisionName // empty' "$RUNNER_TEMP/pool.json")"
            ready="$(jq -r '.status.latestReadyRevisionName // empty' "$RUNNER_TEMP/pool.json")"
            serving="$(jq -r '[.status.instanceSplits[]? | select(.percent > 0) | .revisionName] | join(",")' "$RUNNER_TEMP/pool.json")"
            if [ -z "$revision" ] || [ "$ready" != "$revision" ] || [ "$serving" != "$revision" ]; then
              echo "::error::$resource serves '$serving', not its new revision $revision."
              exit 1
            fi
            running="$(gcloud run worker-pools revisions describe "$revision" --format='value(status.imageDigest)')"
            if [ "${running##*@}" != "${IMAGE##*@}" ]; then
              echo "::error::$resource's revision $revision runs $running, not $IMAGE."
              exit 1
            fi
            echo "$resource runs $IMAGE on revision $revision"
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")

      # Waits only until the new instance is healthy, which is when the load
      # balancer sends it new flows. `wait-until --stable` would also wait for
      # the old one to drain. The wait is bounded to leave time to roll back.
      - name: Roll out the instance groups
        run: |
          set -euo pipefail
          # The rollback step runs this file too.
          cat >"$RUNNER_TEMP/instance-group.sh" <<'HELPERS'
          # healthy_instance GROUP TEMPLATE SECONDS: waits for a healthy
          # instance on TEMPLATE and prints its URL.
          healthy_instance() {
            local deadline=$((SECONDS + $3)) instance
            while :; do
              instance="$(gcloud compute instance-groups managed list-instances "$1" \
                --region "$CLOUDSDK_COMPUTE_REGION" --format=json \
                | jq -r --arg t "${2#*/projects/}" 'first(.[]
                    | select(((.version.instanceTemplate // "") | sub("^.*/projects/"; "")) == $t
                      and .instanceStatus == "RUNNING" and .currentAction == "NONE"
                      and (.instanceHealth // []) != []
                      and all(.instanceHealth[]; .detailedHealthState == "HEALTHY"))
                    | .instance) // empty')"
              if [ -n "$instance" ]; then
                echo "$instance"
                return 0
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                return 1
              fi
              sleep 10
            done
          }

          # update_limits KIND GROUP_JSON: prints a rolling update's max surge
          # and max unavailable. A node is replaced in place, since only one
          # instance may hold its node ID. A regional group refuses a nonzero
          # value below its zone count.
          update_limits() {
            local zones
            zones="$(jq '[.distributionPolicy.zones[]?] | length | if . == 0 then 1 else . end' "$2")"
            if [ "$1" = instance-group-node ]; then
              echo "0 $zones"
            else
              echo "$zones 0"
            fi
          }
          HELPERS
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/instance-group.sh"
          token="$(gcloud auth print-access-token)"
          auth=(-H "Authorization: Bearer $token" -H "Content-Type: application/json")
          digest="${IMAGE##*@}"
          while IFS=$'\t' read -r name kind; do
            [ "$kind" = instance-group ] || [ "$kind" = instance-group-node ] || continue
            mapfile -t groups < <(jq -r --arg n "$name" \
              '.[$n] | if type == "array" then .[] else . end' <<<"$DEPLOY_RESOURCES")
            if [ "$kind" = instance-group-node ] || [ "${#groups[@]}" -gt 1 ]; then
              record="instance-group-node"
            else
              record="instance-group"
            fi
            for group in "${groups[@]}"; do
              gcloud compute instance-groups managed describe "$group" \
                --region "$CLOUDSDK_COMPUTE_REGION" --format=json >"$RUNNER_TEMP/group.json"
              current="$(jq -r 'if (.versions | length) == 1 then .versions[0].instanceTemplate else empty end' \
                "$RUNNER_TEMP/group.json")"
              if [ -z "$current" ]; then
                echo "::error::$group isn't on exactly one instance template."
                exit 1
              fi
              read -r surge unavailable < <(update_limits "$record" "$RUNNER_TEMP/group.json")

              # A rerun of the same digest finds its template already made.
              hex="${digest#sha256:}"
              template_name="${group:0:50}"
              template_name="${template_name%-}-${hex:0:12}"
              template="${current%/*}/$template_name"
              status="$(curl -sS -o "$RUNNER_TEMP/template.json" -w '%{http_code}' "${auth[@]}" "$template")"
              if [ "$status" = 404 ]; then
                curl -fsS "${auth[@]}" "$current" >"$RUNNER_TEMP/current.json"
                jq -e '[.properties.metadata.items[]? | select(.key == "image")] | length == 1' \
                  "$RUNNER_TEMP/current.json" >/dev/null \
                  || { echo "::error::$current has no image metadata."; exit 1; }
                jq --arg name "$template_name" --arg image "$IMAGE" '
                  {name: $name, properties: (.properties
                    | .metadata.items |= map(if .key == "image" then .value = $image else . end)
                    | del(.metadata.fingerprint))}' \
                  "$RUNNER_TEMP/current.json" >"$RUNNER_TEMP/template.json"
                operation="$(curl -fsS "${auth[@]}" --data @"$RUNNER_TEMP/template.json" "${current%/*}" | jq -r .selfLink)"
                # A wait call can return, after about 2 minutes, before the
                # operation is done.
                while :; do
                  curl -fsS "${auth[@]}" -X POST "$operation/wait" >"$RUNNER_TEMP/operation.json"
                  jq -e '.status == "DONE"' "$RUNNER_TEMP/operation.json" >/dev/null && break
                done
                if jq -e '.error' "$RUNNER_TEMP/operation.json" >/dev/null; then
                  echo "::error::Creating $template failed: $(jq -c .error "$RUNNER_TEMP/operation.json")"
                  exit 1
                fi
              elif [ "$status" = 200 ]; then
                jq -e --arg image "$IMAGE" '[.properties.metadata.items[]? | select(.key == "image") | .value] == [$image]' \
                  "$RUNNER_TEMP/template.json" >/dev/null \
                  || { echo "::error::$template exists with another image."; exit 1; }
              else
                echo "::error::Reading $template returned HTTP $status."
                exit 1
              fi

              gcloud compute instance-groups managed rolling-action start-update "$group" \
                --region "$CLOUDSDK_COMPUTE_REGION" --version=template="$template" \
                --max-surge="$surge" --max-unavailable="$unavailable" --quiet
              printf '%s\t%s\t%s\n' "$record" "$group" "$current" >>"$RUNNER_TEMP/rollback.tsv"
              instance="$(healthy_instance "$group" "$template" 240)" \
                || { echo "::error::No instance of $group on $template was healthy within 4 minutes."; exit 1; }

              zone="$(sed -E 's|.*/zones/([^/]+)/.*|\1|' <<<"$instance")"
              running=""
              for _ in 1 2 3 4 5 6; do
                if running="$(gcloud compute instances get-guest-attributes "${instance##*/}" --zone "$zone" \
                  --query-path=container/image --format='value(value)' 2>/dev/null)" && [ -n "$running" ]; then
                  break
                fi
                sleep 5
              done
              if [ "${running##*@}" != "$digest" ]; then
                echo "::error::${instance##*/} runs '$running', not $IMAGE."
                exit 1
              fi
              echo "$group runs $IMAGE on ${instance##*/}"
            done
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")

      - name: Move traffic and jobs to the new image
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r resource revision _ _; do
            previous="$(gcloud run services describe "$resource" --format=json \
              | jq -r '[.status.traffic[] | select(.percent > 0) | "\(.revisionName)=\(.percent)"] | join(",")')"
            gcloud run services update-traffic "$resource" --to-revisions="$revision=100" --quiet
            printf 'cloud-run\t%s\t%s\n' "$resource" "$previous" >>"$RUNNER_TEMP/rollback.tsv"
          done <"$RUNNER_TEMP/candidates.tsv"
          while IFS=$'\t' read -r name kind; do
            resource="$(jq -r --arg n "$name" '.[$n]' <<<"$DEPLOY_RESOURCES")"
            case "$kind" in
              cloud-run-job)
                previous="$(gcloud run jobs describe "$resource" --format=json \
                  | jq -r '.spec.template.spec.template.spec.containers[0].image')"
                gcloud run jobs update "$resource" --image "$IMAGE" --quiet
                printf 'cloud-run-job\t%s\t%s\n' "$resource" "$previous" >>"$RUNNER_TEMP/rollback.tsv"
                ;;
            esac
          done < <(jq -r '.[] | [.name, .kind] | @tsv' <<<"$TARGETS")

      # After the rollout, so the Smoke Device checks the Server as it now
      # serves.
      - name: Read the Smoke Device's keys
        if: inputs.smoke-device
        env:
          SMOKE_DEVICE: ${{ vars.SMOKE_DEVICE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/smoke-device"
          for key in bootstrap-psk device-key psk; do
            if ! gcloud secrets versions access latest --secret "$SMOKE_DEVICE-$key" \
              --out-file "$RUNNER_TEMP/smoke-device/$key"; then
              rm -rf "$RUNNER_TEMP/smoke-device"
              echo "::error::Can't read $SMOKE_DEVICE's $key, so the Smoke Device can't run. Is it Provisioned, with its keys stored?"
              exit 1
            fi
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] || echo "::add-mask::$line"
            done <"$RUNNER_TEMP/smoke-device/$key"
          done

      - name: Authenticate the smoke suite
        id: ci-reader
        if: inputs.smoke-device
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.CI_READER_WIF_PROVIDER }}
          service_account: ${{ vars.CI_READER_SERVICE_ACCOUNT }}
          # The later steps keep the deploy identity.
          export_environment_variables: false

      - name: Check out the smoke suite
        if: inputs.smoke-device
        uses: actions/checkout@v4
        with:
          repository: Prevasum/local-stack
          ref: main
          token: ${{ secrets.local-stack-token }}
          path: local-stack
          persist-credentials: false

      # setup-uv publishes no major-version tag, so it's pinned to a release.
      # From the checkout, it installs the uv version local-stack asks for.
      - name: Install uv
        if: inputs.smoke-device
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: local-stack

      - name: Run the Smoke Device
        if: inputs.smoke-device
        env:
          SMOKE_DEVICE: ${{ vars.SMOKE_DEVICE }}
          SMOKE_GATEWAY_URI: ${{ vars.SMOKE_GATEWAY_URI }}
          SMOKE_CLIENT_SECRET: ${{ secrets.smoke-client-secret }}
          CI_READER_CREDENTIALS: ${{ steps.ci-reader.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          # Bounded so a hung run can't hold the concurrency group.
          status=0
          env -u GOOGLE_GHA_CREDS_PATH -u CLOUDSDK_CORE_PROJECT -u CLOUDSDK_PROJECT \
            -u GCLOUD_PROJECT -u GCP_PROJECT -u GOOGLE_CLOUD_PROJECT \
            -u CLOUDSDK_RUN_REGION -u CLOUDSDK_COMPUTE_REGION \
            GOOGLE_APPLICATION_CREDENTIALS="$CI_READER_CREDENTIALS" \
            CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$CI_READER_CREDENTIALS" \
            SMOKE_ENVIRONMENT=dev \
            SMOKE_DEVICE_ID="$SMOKE_DEVICE" \
            SMOKE_BOOTSTRAP_PSK_FILE="$RUNNER_TEMP/smoke-device/bootstrap-psk" \
            SMOKE_DEVICE_KEY_FILE="$RUNNER_TEMP/smoke-device/device-key" \
            SMOKE_PSK_FILE="$RUNNER_TEMP/smoke-device/psk" \
            timeout 600 bash local-stack/smoke/run.sh || status=$?
          rm -rf "$RUNNER_TEMP/smoke-device"
          case "$status" in
            0) echo "$SMOKE_DEVICE passed the smoke suite" ;;
            124) echo "::error::The smoke suite didn't finish within 10 minutes."; exit 1 ;;
            *) echo "::error::$SMOKE_DEVICE failed the smoke suite."; exit 1 ;;
          esac

      # After smoke, since every reader of a tag trusts its digest.
      - name: Move the Environment tags
        env:
          TAG_PROD: ${{ inputs.tag-prod }}
        run: |
          set -euo pipefail
          repository="${IMAGE%@*}"
          tags=(dev)
          if [ "$TAG_PROD" = true ]; then
            tags+=(prod)
          fi
          for tag in "${tags[@]}"; do
            # A tag's first move has nothing to go back to.
            if previous="$(gcloud artifacts docker images describe "$repository:$tag" \
              --format='value(image_summary.digest)' 2>/dev/null)"; then
              printf 'tag\t%s\t%s\n' "$repository:$tag" "$repository@$previous" >>"$RUNNER_TEMP/rollback.tsv"
            fi
            gcloud artifacts docker tags add "$IMAGE" "$repository:$tag" --quiet
          done

      # A candidate that failed smoke never took traffic, so it needs no
      # rollback.
      - name: Roll back
        id: rollback
        if: failure()
        run: |
          set -uo pipefail
          if [ ! -s "$RUNNER_TEMP/rollback.tsv" ]; then
            echo "rollback=none" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          failed=0
          while IFS=$'\t' read -r kind resource previous; do
            case "$kind" in
              cloud-run) gcloud run services update-traffic "$resource" --to-revisions="$previous" --quiet || failed=1 ;;
              cloud-run-job) gcloud run jobs update "$resource" --image "$previous" --quiet || failed=1 ;;
              worker-pool) gcloud run worker-pools deploy "$resource" --image "$previous" --quiet || failed=1 ;;
              instance-group | instance-group-node)
                # shellcheck source=/dev/null
                . "$RUNNER_TEMP/instance-group.sh"
                gcloud compute instance-groups managed describe "$resource" \
                  --region "$CLOUDSDK_COMPUTE_REGION" --format=json >"$RUNNER_TEMP/group.json" || failed=1
                read -r surge unavailable < <(update_limits "$kind" "$RUNNER_TEMP/group.json")
                if gcloud compute instance-groups managed rolling-action start-update "$resource" \
                  --region "$CLOUDSDK_COMPUTE_REGION" --version=template="$previous" \
                  --max-surge="$surge" --max-unavailable="$unavailable" --quiet; then
                  healthy_instance "$resource" "$previous" 240 >/dev/null || failed=1
                else
                  failed=1
                fi
                ;;
              tag) gcloud artifacts docker tags add "$previous" "$resource" --quiet || failed=1 ;;
            esac
          done <"$RUNNER_TEMP/rollback.tsv"
          if [ "$failed" -ne 0 ]; then
            echo "rollback=failed" >>"$GITHUB_OUTPUT"
            echo "::error::The rollback failed; restore the previous revisions, job and worker pool images, instance templates, and tags by hand."
          else
            echo "rollback=done" >>"$GITHUB_OUTPUT"
          fi
          exit "$failed"

  publish-prod:
    needs: build
    if: inputs.build-only
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deliver-${{ inputs.service }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Move :prod
        run: |
          set -euo pipefail
          repository="${IMAGE%@*}"
          if previous="$(gcloud artifacts docker images describe "$repository:prod" \
            --format='value(image_summary.digest)' 2>/dev/null)"; then
            echo "Moved $repository:prod from $previous to ${IMAGE##*@}" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Set $repository:prod to ${IMAGE##*@}" >>"$GITHUB_STEP_SUMMARY"
          fi
          gcloud artifacts docker tags add "$IMAGE" "$repository:prod" --quiet

  # failure() skips a run cancelled for a newer pending one.
  notify:
    needs: [build, dev, publish-prod]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Server on-call
        env:
          WEBHOOK: ${{ secrets.oncall-webhook }}
          SERVICE: ${{ inputs.service }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish-prod.result }}
          ROLLBACK: ${{ needs.dev.outputs.rollback }}
        run: |
          set -euo pipefail
          if [ "$BUILD" = failure ]; then
            what="didn't build, so nothing was deployed"
          elif [ "$PUBLISH" = failure ]; then
            what="built, but moving :prod failed"
          else
            case "$ROLLBACK" in
              done) what="failed in dev and was rolled back" ;;
              failed) what="failed in dev, and its rollback failed too: restore dev by hand" ;;
              *) what="failed in dev with nothing to roll back" ;;
            esac
          fi
          text="Deploy of $SERVICE from $REPOSITORY at ${SHA:0:7} $what. $RUN_URL"
          echo "$text"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::No oncall-webhook secret, so nothing was posted to Server on-call."
            exit 0
          fi
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS --retry 3 -o /dev/null -H 'Content-Type: application/json; charset=UTF-8' \
              --data @- "$WEBHOOK"
